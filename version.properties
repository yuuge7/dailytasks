# Single source of truth for the app version.
#
# Bumped automatically on every push to main by .github/workflows/release.yml,
# based on the Conventional Commit prefixes since the last release tag:
#
#   feat:                      -> minor   (1.2 -> 1.3)
#   fix: / perf:               -> patch   (1.2 -> 1.2.1)
#   feat!: / BREAKING CHANGE:  -> major   (1.2 -> 2.0)
#
# Anything else (docs, chore, ci, refactor, style, test) publishes nothing, so
# routine commits still never spam the Releases page.
#
# To force a specific version, edit the line below by hand: when no release tag
# exists for that value yet, the workflow publishes it as-is instead of bumping.
#
# versionCode is derived from this in app/build.gradle.kts — never set it by hand.
versionName=1.2
