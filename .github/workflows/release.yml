name: Release

# Publishes a signed APK whenever main receives commits that deserve a release.
#
# The version is NOT maintained by hand: it lives in version.properties and is
# bumped here from the Conventional Commit prefixes since the last release tag
# (feat -> minor, fix/perf -> patch, ! or BREAKING CHANGE -> major). Commits that
# are only docs/chore/ci/refactor/style/test publish nothing, so day-to-day work
# still never spams the Releases page.
#
# Editing version.properties by hand still works: if the version written there has
# no release tag yet, it is published as-is instead of being bumped.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part to bump (auto = decide from commit messages)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history + tags: the bump is derived from the commits since the
          # last release tag, so a shallow clone would see nothing.
          fetch-depth: 0

      - name: Decide next version
        id: version
        run: |
          set -euo pipefail

          current="$(sed -n 's/^versionName[[:space:]]*=[[:space:]]*//p' version.properties | head -n 1 | tr -d '[:space:]')"
          if [ -z "$current" ]; then
            echo "::error file=version.properties::Could not read versionName"
            exit 1
          fi
          echo "Current version: $current"

          requested="${{ github.event.inputs.bump || 'auto' }}"

          if ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            # Someone bumped version.properties by hand — honour it verbatim.
            echo "No tag v$current yet — publishing that version as-is."
            level="none"
            new="$current"
          else
            if [ "$requested" != "auto" ]; then
              level="$requested"
              echo "Manual bump requested: $level"
            else
              subjects="$(git log --format=%s "v$current..HEAD")"
              bodies="$(git log --format=%B "v$current..HEAD")"

              level="none"
              if printf '%s\n' "$bodies"   | grep -qiE '^BREAKING[ -]CHANGE:' \
              || printf '%s\n' "$subjects" | grep -qE  '^[a-zA-Z]+(\([^)]*\))?!:'; then
                level="major"
              elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
                level="minor"
              elif printf '%s\n' "$subjects" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
                level="patch"
              fi
              echo "Commits since v$current imply: $level"
            fi

            if [ "$level" = "none" ]; then
              echo "Nothing release-worthy since v$current — skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            major="$(echo "$current" | cut -d. -f1)"
            minor="$(echo "$current" | cut -d. -f2)"
            patch="$(echo "$current" | cut -d. -f3)"
            major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"

            case "$level" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac

            # Keep the short 1.3 form when there is no patch component
            if [ "$patch" -eq 0 ]; then new="$major.$minor"; else new="$major.$minor.$patch"; fi
          fi

          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::Tag v$new already exists — refusing to overwrite a release."
            exit 1
          fi

          echo "Publishing version $new (bump: $level)"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$new" != "$current" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see README, section 'Release signing'."
            exit 1
          fi

      - name: Apply new version
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^versionName[[:space:]]*=.*/versionName=${{ steps.version.outputs.version }}/" version.properties
          grep '^versionName=' version.properties

      - name: Set up JDK 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode keystore
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Built before the version commit is pushed: a broken build must not leave a
      # bumped version behind on main.
      - name: Build signed release APK
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK for upload
        if: steps.version.outputs.publish == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "DailyFocus-${{ steps.version.outputs.tag }}.apk"

      - name: Commit version bump
        id: commit
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.changed }}" != "true" ]; then
            echo "Version was set by hand — nothing to commit."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          # [skip ci] plus the fact that pushes made with GITHUB_TOKEN do not start
          # new workflow runs — belt and braces against a release loop.
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "DailyFocus-${{ steps.version.outputs.tag }}.apk" \
            --title "DailyFocus ${{ steps.version.outputs.tag }}" \
            --target "${{ steps.commit.outputs.sha }}" \
            --generate-notes

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
